<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1340" viewBox="0 0 1600 1340" role="img" aria-labelledby="title desc"><title id="title">青行校园共享自行车：八实体、十一项命名联系、十三条角色边</title><desc id="desc">用户创建骑行订单，订单使用自行车，车辆当前停放停车区；订单分别有骑行起点和终点，且最多一笔支付。运维执行调度，停车区分别调出和调入，调度包含多辆车并通过关联表表达多对多。用户提交报修，车辆发生故障，运维负责维修。运行中车辆位置与结束站、待分配员工可空。</desc><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif}.edge{fill:none;stroke:#63948d;stroke-width:2.5;stroke-linejoin:round}.label{font-size:17px;fill:#215b51;font-weight:600;paint-order:stroke;stroke:#f3f8f7;stroke-width:10px;stroke-linejoin:round}.field{font-size:16px;fill:#45616b}</style><rect width="1600" height="1340" fill="#f3f8f7"/><text x="80" y="60" font-size="32" font-weight="700" fill="#153d39">青行 Qingxing · 校园共享自行车 E-R 图</text><text x="80" y="97" font-size="19" fill="#55766e">8 核心实体 / 11 命名联系 / 13 角色边 · 16 物理表 = 8 + 1 关联 + 7 支持</text><path d="M380 190H650" class="edge"/><path d="M190 580V460H695V330" class="edge"/><path d="M650 630H380" class="edge"/><path d="M740 580V330" class="edge"/><path d="M870 580V330" class="edge"/><path d="M950 210H1220" class="edge"/><path d="M1320 1010V760" class="edge"/><path d="M950 620H1220" class="edge"/><path d="M950 700H1220" class="edge"/><path d="M1220 740H1080V835H230V760" class="edge"/><path d="M80 240H35V1080H80" class="edge"/><path d="M230 760V1010" class="edge"/><path d="M1220 1090H380" class="edge"/><text x="515" y="180" text-anchor="middle" class="label" >创建订单 1 : N</text><text x="425" y="452" text-anchor="middle" class="label" >使用车辆 1 : N</text><text x="515" y="620" text-anchor="middle" class="label" >当前停放 0..1 : N</text><text x="735" y="420" text-anchor="middle" class="label" >骑行起点 1 : N</text><text x="875" y="500" text-anchor="middle" class="label" >骑行终点 0..1 : N</text><text x="1085" y="200" text-anchor="middle" class="label" >支付结算 1 : 0..1</text><text x="1320" y="885" text-anchor="middle" class="label" >执行调度 0..1 : N</text><text x="1085" y="610" text-anchor="middle" class="label" >调出 1 : N</text><text x="1085" y="690" text-anchor="middle" class="label" >调入 1 : N</text><text x="670" y="825" text-anchor="middle" class="label" >包含车辆 M : N · dispatch_bikes</text><text x="35" y="940" text-anchor="middle" class="label" transform="rotate(-90 35 940)">提交报修 1 : N</text><text x="230" y="895" text-anchor="middle" class="label" >发生故障 1 : N</text><text x="800" y="1080" text-anchor="middle" class="label" >负责维修 0..1 : N</text><g><rect x="80" y="150" width="300" height="180" rx="14" fill="white" stroke="#bbd2ce" stroke-width="1.5"/><rect x="80" y="150" width="300" height="54" rx="14" fill="#174940"/><rect x="80" y="180" width="300" height="24" fill="#174940"/><text x="98" y="185" font-size="22" fill="white" font-weight="700">用户</text><text x="98" y="230" font-size="17" fill="#258974">users</text><text x="98" y="258" class="field">PK id · UK email / phone</text><text x="98" y="285" class="field">账户昵称 · 角色 · 状态</text></g><g><rect x="650" y="150" width="300" height="180" rx="14" fill="white" stroke="#bbd2ce" stroke-width="1.5"/><rect x="650" y="150" width="300" height="54" rx="14" fill="#174940"/><rect x="650" y="180" width="300" height="24" fill="#174940"/><text x="668" y="185" font-size="22" fill="white" font-weight="700">骑行订单</text><text x="668" y="230" font-size="17" fill="#258974">ride_orders</text><text x="668" y="258" class="field">PK id · FK user / bike</text><text x="668" y="285" class="field">FK start_zone / end_zone</text><text x="668" y="312" class="field">费用分 · 估算里程 · 状态</text></g><g><rect x="1220" y="150" width="300" height="180" rx="14" fill="white" stroke="#bbd2ce" stroke-width="1.5"/><rect x="1220" y="150" width="300" height="54" rx="14" fill="#174940"/><rect x="1220" y="180" width="300" height="24" fill="#174940"/><text x="1238" y="185" font-size="22" fill="white" font-weight="700">支付记录</text><text x="1238" y="230" font-size="17" fill="#258974">payments</text><text x="1238" y="258" class="field">PK id · UK order_id</text><text x="1238" y="285" class="field">UK idempotency_key</text><text x="1238" y="312" class="field">金额分 · SIMULATED</text></g><g><rect x="80" y="580" width="300" height="180" rx="14" fill="white" stroke="#bbd2ce" stroke-width="1.5"/><rect x="80" y="580" width="300" height="54" rx="14" fill="#174940"/><rect x="80" y="610" width="300" height="24" fill="#174940"/><text x="98" y="615" font-size="22" fill="white" font-weight="700">自行车</text><text x="98" y="660" font-size="17" fill="#258974">bikes</text><text x="98" y="688" class="field">PK id · UK code</text><text x="98" y="715" class="field">FK current_zone_id（可空）</text><text x="98" y="742" class="field">状态 · 投放 / 维修时间</text></g><g><rect x="650" y="580" width="300" height="180" rx="14" fill="white" stroke="#bbd2ce" stroke-width="1.5"/><rect x="650" y="580" width="300" height="54" rx="14" fill="#174940"/><rect x="650" y="610" width="300" height="24" fill="#174940"/><text x="668" y="615" font-size="22" fill="white" font-weight="700">停车区</text><text x="668" y="660" font-size="17" fill="#258974">parking_zones</text><text x="668" y="688" class="field">PK id · UK name</text><text x="668" y="715" class="field">圆心 x / y · radius</text><text x="668" y="742" class="field">capacity · status</text></g><g><rect x="1220" y="580" width="300" height="180" rx="14" fill="white" stroke="#bbd2ce" stroke-width="1.5"/><rect x="1220" y="580" width="300" height="54" rx="14" fill="#174940"/><rect x="1220" y="610" width="300" height="24" fill="#174940"/><text x="1238" y="615" font-size="22" fill="white" font-weight="700">调度任务</text><text x="1238" y="660" font-size="17" fill="#258974">dispatch_tasks</text><text x="1238" y="688" class="field">PK id · FK staff_id（可空）</text><text x="1238" y="715" class="field">FK source_zone / target_zone</text><text x="1238" y="742" class="field">状态 · 创建 / 执行时间</text></g><g><rect x="80" y="1010" width="300" height="180" rx="14" fill="white" stroke="#bbd2ce" stroke-width="1.5"/><rect x="80" y="1010" width="300" height="54" rx="14" fill="#174940"/><rect x="80" y="1040" width="300" height="24" fill="#174940"/><text x="98" y="1045" font-size="22" fill="white" font-weight="700">维修工单</text><text x="98" y="1090" font-size="17" fill="#258974">maintenance_tickets</text><text x="98" y="1118" class="field">PK id · FK bike / reporter</text><text x="98" y="1145" class="field">FK staff_id（可空）</text><text x="98" y="1172" class="field">故障 · 结果 · 状态</text></g><g><rect x="1220" y="1010" width="300" height="180" rx="14" fill="white" stroke="#bbd2ce" stroke-width="1.5"/><rect x="1220" y="1010" width="300" height="54" rx="14" fill="#174940"/><rect x="1220" y="1040" width="300" height="24" fill="#174940"/><text x="1238" y="1045" font-size="22" fill="white" font-weight="700">运维人员</text><text x="1238" y="1090" font-size="17" fill="#258974">staff</text><text x="1238" y="1118" class="field">PK id · UK/FK user_id</text><text x="1238" y="1145" class="field">同步姓名 · 联系电话</text><text x="1238" y="1172" class="field">工种 · 值勤状态</text></g><rect x="80" y="1230" width="1440" height="82" rx="12" fill="#e3eeea"/><text x="100" y="1260" font-size="17" fill="#355d53">PK 主键 · FK 外键 · UK 非空唯一键；0..1 表示子记录可以暂未关联父端，N 端可没有历史记录。</text><text x="100" y="1290" font-size="17" fill="#355d53">起点 / 终点、调出 / 调入分别为两条边；账户绑定与支持表外键见完整报告；可空 UNIQUE 不等于全表候选码。</text></svg>